<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Absolute Position</title>
    <style>
        .demo{
            height: 150px;
            width: 200px;
            background-color: orangered;
            position: absolute;
            bottom: 30px;
            right: 50px;
            
        }
    </style>
</head>
<body>
    <pre>
        When there is no parent element or if there is no position defined 
        on the parent element of absolute position element then absolute 
        position will work with reference to body/browser.
    </pre>
    <div class="demo"></div>
</body>
</html>
