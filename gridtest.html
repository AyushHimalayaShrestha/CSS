<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <title>Grid</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        .container{
            background-color: darkgrey;
            display: grid;
            grid-template-rows:repeat(3, 300px) ;
            grid-template-columns: 400px 1fr 1fr;
            gap: 10px;
        }
        .item{
            border: 2px dotted rgb(55, 65, 41);
            border-radius:5px ;
        }
        .item1{
           background-image: url('https://img.freepik.com/free-photo/3d-fox-cartoon-illustration_23-2151395192.jpg?size=626&ext=jpg');
           background-size: cover;
           background-position: center;
           grid-row-start: 1;
           grid-row-end: 2;
        }
        .item2{
           background-image:url('https://plus.unsplash.com/premium_photo-1665952050051-8fc03087677a?q=80&w=2938&auto=format&fit=crop&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D');
           background-size:cover ;
           background-position: center;
           grid-row-start: 2;
           grid-row-end:3 ;
        }
        .item3{
            background-image: url('https://images.unsplash.com/photo-1516708274537-6f91e34ccaf2?q=80&w=2940&auto=format&fit=crop&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D');
           background-size: cover;
           background-position: center;
            grid-row-start: 3;
            grid-row-end: 4;
        }
        .item4{
            background-image: url('https://images.unsplash.com/photo-1504578957268-924fac546438?w=800&auto=format&fit=crop&q=60&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MTl8fGN1dGUlMjBhbmltYWx8ZW58MHx8MHx8fDA%3D');
           background-size: cover;
           background-position: center;
            grid-column-start: 2/3;
            
        }
        .item5{
            background-image: url('https://images.unsplash.com/photo-1505852012909-3da5aab64dcb?q=80&w=2891&auto=format&fit=crop&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D');
           background-size: cover;
           background-position: center;
            grid-column-start: 3;
            grid-row-start: 2;
        }
        .item6{
            background-image: url('https://rnn.ng/wp-content/uploads/2023/04/Most-Friendly-And-Gentle-Animals-To-Humans.jpg');
           background-size: cover;
           background-position: center;
            grid-column-start: 3;
            grid-row-start: 3;
        }
        .item7{
            background-image: url('https://nypost.com/wp-content/uploads/sites/2/2020/03/031120-cute-animals-anti-corona-01.jpg?quality=80&strip=all');
           background-size: cover;
           background-position: center; 
           grid-row: 1/3;
           grid-column: 2/4;
        }
        i{
           font-size: 30px;
           text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item item1">1</div>
        <div class="item item2">2</div>
        <div class="item item3">3</div>
        <div class="item item4">4</div>
        <div class="item item5">5</div>
        <div class="item item6">6</div>
        <div class="item item7">7</div>
    </div>
    <i class="fa-brands fa-meta"></i>

</body>
</html>
