<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selector</title>
    <style>
        *{
            background-color: rgb(15, 150, 105);
        }
        h2{
           color:green;  
           font-size: 50px;
           background-color: aquamarine;
        }
        .title{
            color: red ;
            font-family: 'Times New Roman', Times, serif;
        }
        #demo-title{
            color: rgb(110,120,0);
            background-color: rgb(133, 45, 46);
        }
        .test1{
            color: rgb(112, 21, 173) !important;
            background-color: turquoise;
        }
        #content{
            color: rgb(190, 206, 14);
            background-color: rgb(18, 87, 165);
        }
        .title,#demo-title{
            /* text-transform: uppercase; */
            text-transform: capitalize;
        }
    </style>
</head>
<body>
<h2>This is styled using element selector.</h2>    
<h1 class="title">This is styled using class selector.</h1>
<h1 id="demo-title">This is styled using id selector. </h1>
<h1 class="test1" id="content">This is a demo title.</h1>
</body>
</html>
