<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transform Translate</title>
    <style>
        .demo-box{
            height: 30vh;
            width: 50vw;
            background-color: orangered;
            margin: 30px auto;
            transition: all 3s;
        }
        .demo-box:hover{
            /* transform: translateY(-20px); */
           transform: translate(30px,40px);
        }
    </style>
</head>
<body>
    <div class="demo-box"></div>
</body>
</html>
