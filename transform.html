<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transform</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        .box img{
            height: 100%;
            width: 100%;
            transition: all 2s;
            transform: scale(0) rotate(180deg);
        }
        .box{
            height: 400px;
            width: 300px;
            margin: 50px auto;
           
            position: relative;
            transition: all 2s;
            border: 2px solid red;
            overflow: hidden;
        }
        .demo{
          position: absolute;
            background-color: darkgreen;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            transform: scale(0)rotate(180deg);
            transform: scaley(1) rotate(0);
            transition: all 2s;
            text-align: center;
            
           
        }
        .box:hover .demo{ 
        transform: scale(0) rotate(180deg);
           
            
        }
        .box:hover img{
transform: scale(1) rotate(0);
        }

    </style>
</head>
<body>
    <div class="box">
        <img src="https://cdn.pixabay.com/photo/2024/05/26/10/15/bird-8788491_1280.jpg" alt="">
        <div class="demo">
            HOVER ME
        </div>
    </div>
</body>
</html>
