<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <title>Icons</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        .container{
            display: flex;
            justify-content: center;
        }
        i{
           
            font-size: 50px;
            margin-top: 50px;
            margin-left: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <i class="fa-brands fa-meta fa-shake"></i>
        <i class="fa-solid fa-scale-unbalanced fa-beat-fade"></i>
        <i class="fa-brands fa-facebook fa-spin"></i>
    </div>
   
</body>
</html>
