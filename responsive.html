<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <title>Responsive</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        header{
            background-color: darkcyan;
        }
        nav{
            max-width: 1200px;
            display: flex;
            justify-content: space-between;
            padding: 0 20px;
            align-items: center;
            margin: auto;
        }
        ul{
            display: flex;
        }
        ul li{
            padding: 10px;
            list-style-type: none;
        }
        ul li a{
            
            text-decoration: none;
            color: white;
            margin-right:10px ;
            padding: 10px;
        }
        .mobilemenu{
            display: none;
        }
        .container{
            display: flex;
            flex-wrap: wrap;
            justify-content: space-evenly;
            max-width: 1200px;
            margin:auto;
        }
        .box{
            width: 22%;
            height: 250px;
            background-color: darkgreen;
        }
    </style>
</head>
<body>
    <header>
    <nav>
        <h2>Title</h2>
        <ul>
            <li class="lg-menu"><a href="#">Home</a></li>
            <li class="lg-menu"><a href="#">Gallery</a></li>
            <li class="lg-menu"><a href="#">Contact</a></li>
            <li class="lg-menu"><a href="#">About Us</a></li>
            <li class="mobile-menu"><a href="#"><i class="bi bi-list"></i></a></li>

          

        </ul>
    </nav>
</header>
    <div class="container">
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
    </div>
</body>
</html>
