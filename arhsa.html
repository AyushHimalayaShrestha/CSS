<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arhsa</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        .container{
            height: 80vh;
            width: 100vw;
            background-color: rgb(45, 45, 124);
            display: flex;
        }
        .demo h3{
            color: wheat;
            font-size: 35px;
            margin: 20px 0 20px 110px ;
            text-transform: uppercase;
            font-family:'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            font-weight: 545;
        }
        .demo h2{
            margin:90px 10px 0 110px;
            color: white;
            text-transform: capitalize;
            font-size: 45px;
            font-weight: 700;
            font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .demo h4{
            color: rgb(151, 149, 145);
            margin: 10px 10px 10px 110px;
            font-size: 20px;
            font-weight: 620;
            font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            
        }
        .demo2 img{
            height: 480px;
            width: 560px;
            animation: up-down 3s ease-in-out infinite;
            margin:auto 80px;
        }
        @keyframes up-down {
            0%{
                transform: translateY(-10px);
            }
            50%{
                transform: translateY(20px);
            }
            
        }
        
    </style>
</head>
<body>
    <div class="container">
        <div class="demo">
            <h3>Arhsa</h3>
            <h2>better solutions for your business</h2>
            <h4>We are team of talented designers making website with Bootstrap</h4>
        </div>
        <div class="demo2">
            <img src="/images/hero-img.png" alt="">

        </div>
    </div>
    <section>
        .
    </section>
</body>
</html>
