<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Position</title>
    <style>
        .container{
            height: 250px;
            width: 500px;
            background-color: cornflowerblue;
            position: relative;
            top: 30px;
            right: 30px;
        }
        .demo{
            height: 200px;
            width: 250px;
            background-color: aqua;
        }
    </style>
</head>
<body>
    <pre>
        i> Static Position
        ii> Relative Position
        iii> Absolute Position
        iv> Sticky Position
        v> Fixed Position
    </pre>
    <h1>Relative position</h1>
    <div class="container"></div>
    <div class="demo"></div>
</body>
</html>
