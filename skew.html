<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skew</title>
    <style>
        :root{
            --red:rgb(116, 16, 6);
            --size:20px;
        }
        .container{
            --red:orangered;
            height: 40vh;
            width: 20vw;
            background-color:var(--red);
            margin: var(--size);
            /* transform: skewY(-10deg); */
            transform: skew(10deg, 10deg);
        }
        .container img{
            height: 100%;
            width: 100%;
            object-fit: cover;
            filter: grayscale(1.0);
        }
        .container:hover img{
            filter: blur(1px);
        }
    </style>
</head>
<body>
    <div class="container">
<img src="https://images.pexels.com/photos/18490341/pexels-photo-18490341.jpeg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=1" alt="">
    </div>
</body>
</html>
